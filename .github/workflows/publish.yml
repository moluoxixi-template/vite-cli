name: Publish

# 发布工作流
# 支持两种发布模式：
# 1. main 分支推送：自动版本号+1并发布到 npm
# 2. v* tag 推送：直接发布到 npm（不更新版本号，适合手动版本管理）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 安全扫描任务
  # 检查依赖是否存在已知漏洞
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - run: pnpm install
      # 安全审计：检查 high 及以上级别的漏洞
      # 使用 || true 避免因漏洞导致 CI 失败（仅作为警告）
      # 如需严格模式，移除 || true
      - name: Security audit
        run: pnpm audit --audit-level=high || true

  # 测试任务
  # 在所有发布操作之前运行，确保代码质量
  # 使用矩阵策略在多个平台和 Node.js 版本上测试
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['lts/*']
        # 可选：测试多个 Node.js 版本
        # node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      # 检出代码
      - uses: actions/checkout@v6
      # 设置 pnpm 包管理器
      - uses: pnpm/action-setup@v4
      # 设置 Node.js 运行环境
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # 安装项目依赖
      - run: pnpm install
      # 运行所有测试（单元测试、集成测试、E2E 测试）
      - run: pnpm test

  # 版本号自增任务
  # 仅在分支推送时运行（tag 推送时会被跳过）
  # 自动将 package.json 中的版本号 patch 版本 +1，并提交回仓库
  bump-version:
    # 依赖测试任务和安全扫描，确保测试通过后才执行
    needs: [test, security]
    # 只在分支推送时运行，tag 推送时跳过此任务
    if: github.ref_type == 'branch'
    # 使用 Publish 环境进行部署保护，需要审批才能执行
    environment: Publish
    runs-on: ubuntu-latest
    # 需要写入权限，用于提交代码到仓库
    permissions:
      contents: write
    steps:
      # 检出代码，需要 token 以获取 push 权限
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 设置 pnpm 包管理器
      - uses: pnpm/action-setup@v4
      # 设置 Node.js 运行环境
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      # 配置 git 用户信息，用于后续提交代码
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 安装项目依赖
      - run: pnpm install

      # 版本号自增并提交
      # 1. 使用 pnpm version:patch 自动将版本号 patch 版本 +1（如 2.0.432 -> 2.0.433）
      # 2. 读取更新后的版本号
      # 3. 将 package.json 添加到暂存区
      # 4. 提交更改，使用 [skip ci] 标记避免触发新的 CI 运行
      # 5. 推送到仓库，使用 || exit 0 确保即使提交失败（如版本号未变化）也不会导致任务失败
      - name: Bump version and commit
        run: |
          pnpm version:patch
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to $VERSION [skip ci]" || exit 0
          git push || exit 0

  # 发布到 npm 任务
  # 在版本号自增任务完成后执行，或者当版本号自增任务被跳过时（tag 推送场景）也执行
  # 构建项目并发布到 npm 公共仓库
  release:
    # 依赖版本号自增任务，确保测试通过且版本号递增后才执行
    needs: [bump-version]
    # 使用 Publish 环境进行部署保护，需要审批才能执行
    environment: Publish
    runs-on: ubuntu-latest
    # 权限配置
    # - contents: read: 读取代码权限
    # - id-token: write: 用于 npm 身份验证（OIDC）
    permissions:
      contents: read
      id-token: write
    steps:
      # 检出代码（包含已更新的版本号，如果是分支推送场景）
      - uses: actions/checkout@v6
        # 确保获取最新提交而不是工作流的当前提交
        with:
          ref: main
      # 设置 pnpm 包管理器
      - uses: pnpm/action-setup@v4
      # 设置 Node.js 运行环境并配置 npm registry
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          # 配置 npm registry 为官方公共仓库
          registry-url: 'https://registry.npmjs.org'
      # 确保使用最新版本的 npm（某些 npm 功能可能需要较新版本）
      - name: Update npm
        run: npm install -g npm@latest
      # 安装项目依赖（包括构建依赖）
      - run: pnpm install
      # 构建项目并发布到 npm
      # prepublishOnly 脚本会自动执行构建（在 package.json 中配置）
      # --no-git-checks: 跳过 git 检查，允许在工作流中发布（因为可能是在 CI 环境中）
      - run: pnpm publish:public --no-git-checks
